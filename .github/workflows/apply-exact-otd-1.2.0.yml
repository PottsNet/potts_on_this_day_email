name: Apply exact tested OTD 1.2.0 source

on:
  push:
    branches:
      - fix/issue-9-persist-user-settings
    paths:
      - '.github/workflows/apply-exact-otd-1.2.0.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-9-persist-user-settings
      - name: Restore and verify tested source
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/part* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/otd-source.tar.gz
          echo "879834b172f66516cdc9d7a4db55f7761d92e06f3593385ef54f5d0736db0269  /tmp/otd-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/otd-source.tar.gz -C .
          php -l module.php
          test "$(git hash-object CHANGELOG.md)" = "fb3b05f18fa3e4624f6b55956e5791ecfcb27477"
          test "$(git hash-object README.md)" = "a2d079896c03c5d3abe2f98d76ee6af8c39f4e9a"
          test "$(git hash-object RELEASE_NOTES.md)" = "e50ef0ac3590a4c02083a9560eecbde221c2c11c"
          test "$(git hash-object latest-version.txt)" = "26aaba0e86632e4d537006e45b0ec918d780b3b4"
          test "$(git hash-object module.php)" = "572218caa610258b1042423afd2d91eef1d002a5"
          test "$(git hash-object resources/lang/translations.php)" = "eb404483d37dfcc216a99a34423a2ef3559d7ddd"
          test "$(git hash-object resources/views/admin/settings.phtml)" = "90214ab83ca677f834f680aef3b4594660553a20"
          rm -rf .sync
          rm -f .github/workflows/apply-exact-otd-1.2.0.yml
          git config user.name "PottsNet"
          git config user.email "42736500+PottsNet@users.noreply.github.com"
          git add -A
          git commit -m "Sync v1.2.0 source and persist user settings"
          git push origin HEAD:fix/issue-9-persist-user-settings
